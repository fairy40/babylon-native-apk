name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Download and install Android NDK
      run: |
        sudo apt update
        sudo apt install -y unzip wget
        wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip android-ndk-r25c-linux.zip
        echo "export ANDROID_NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV
        echo "export PATH=$ANDROID_NDK_HOME:$PATH" >> $GITHUB_ENV

    - name: Build Native APK (simulação)
      run: echo "Aqui você colocará os comandos reais de build depois"

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: ./app-release.apk

